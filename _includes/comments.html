<section class="comment-area">
  <div class="comment-wrapper">
    {% if site.giscus-repo %}
    <script>
      (function () {
        var s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.setAttribute('data-repo', '{{ site.giscus-repo }}');
        s.setAttribute('data-repo-id', '{{ site.giscus-repo-id }}');
        s.setAttribute('data-category', '{{ site.giscus-category }}');
        s.setAttribute('data-category-id', '{{ site.giscus-category-id }}');
        s.setAttribute('data-mapping', 'pathname');
        s.setAttribute('data-strict', '0');
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'bottom');
        // Load with whichever theme the page is already in, so comments
        // don't flash light before switching to dark. The dark variant uses
        // a custom giscus theme so its colors match the site's dark palette
        // exactly, instead of giscus's built-in (different) dark preset.
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var theme = isDark ? (window.GISCUS_DARK_THEME || 'dark') : 'light';
        s.setAttribute('data-theme', theme);
        s.setAttribute('data-lang', 'pt');
        s.setAttribute('crossorigin', 'anonymous');
        s.async = true;
        document.currentScript.parentNode.appendChild(s);
      })();
    </script>
    {% endif %}
  </div>
</section> <!-- End Comment Area -->
