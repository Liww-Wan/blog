<div id="cookie-consent" class="cookie-consent" role="dialog" aria-live="polite" aria-label="Consentimento de cookies" hidden>
  <div class="cookie-consent__box">
    <p class="cookie-consent__text">
      Usamos cookies para exibir anúncios e medir o desempenho do site. Você pode aceitar ou recusar os cookies não essenciais a qualquer momento. Saiba mais na nossa
      <a href="{{ "/privacy-policy/" | prepend: site.baseurl }}">Política de Privacidade</a>.
    </p>
    <div class="cookie-consent__actions">
      <button type="button" id="cookie-decline" class="cookie-consent__btn cookie-consent__btn--ghost">Recusar</button>
      <button type="button" id="cookie-accept" class="cookie-consent__btn cookie-consent__btn--solid">Aceitar</button>
    </div>
  </div>
</div>
