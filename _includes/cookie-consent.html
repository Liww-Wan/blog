<div id="cookie-consent" class="cookie-consent" role="dialog" aria-live="polite" aria-label="Consentimento de cookies" hidden>
  <p class="cookie-consent__text">
    Usamos cookies para melhorar sua experiência e, quando autorizado, medir o desempenho do site.
    Saiba mais na nossa <a href="{{ site.baseurl }}/privacidade/">Política de Privacidade</a>.
  </p>
  <div class="cookie-consent__actions">
    <button type="button" id="cookie-consent-decline" class="cookie-consent__btn cookie-consent__btn--decline">Recusar</button>
    <button type="button" id="cookie-consent-accept" class="cookie-consent__btn cookie-consent__btn--accept">Aceitar</button>
  </div>
</div>
